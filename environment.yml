## Trained model

The final trained model is `fused_rep666_stack.pth`.

Due to file size limitations, the model file may not be included directly in this repository.
Please prepare the checkpoint manually if needed.

## Environment

This project was developed and tested in a manually assembled runtime environment, mainly based on ESM / ESMFold-related dependencies, rather than a single clean standalone Conda environment.

### Tested runtime
- Python: 3.11.11
- PyTorch: 2.2.1+cu121
- CUDA: 12.1

### Core Python packages
- h5py 3.15.1
- pandas 2.3.3
- numpy 1.26.4
- tqdm 4.67.1
- scikit-learn 1.6.1
- matplotlib 3.10.0
- biopython 1.83

### Notes
- The actual runtime was assembled from existing ESM / ESMFold-related environments.
- Therefore, exporting a single clean Conda environment may not fully reproduce the original setup.
- Reproduction is recommended by manually installing the core dependencies listed above.
- Some pretrained model files are loaded from local offline paths and need to be prepared manually before running the scripts.


